<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chessmaster AI</title>
<link rel="icon" href="logo.svg">
<style>
:root{--bg:#14161c;--panel:#1d2029;--line:#2c3040;--text:#e8ecf4;--dim:#8a92a6;--teal:#19e6d0;--purple:#9b5cff;--light:#3a4052;--dark:#262a37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",sans-serif;min-height:100vh}
h1,h2{font-weight:600;margin:0}
button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--teal)}
button:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.screen{display:none;max-width:640px;margin:0 auto;padding:1.5rem 1rem}
.screen.on{display:block}
.logo{display:block;width:96px;margin:1rem auto .5rem}
.title{text-align:center;font-size:2rem;letter-spacing:.02em}
.title span{color:var(--teal)}
.sub{text-align:center;color:var(--dim);margin:.3rem 0 1.5rem}
.menu{display:grid;gap:.8rem}
.menu button{font-size:1.1rem;padding:1.1rem;text-align:left;border-left:4px solid var(--teal)}
.menu button.soon{border-left-color:var(--purple)}
.menu small{display:block;color:var(--dim);font-size:.85rem;margin-top:.2rem}
.opts{display:grid;gap:1rem;margin:1.2rem 0}
.opts label{display:grid;gap:.4rem;color:var(--dim)}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.go{background:var(--teal);color:#06231f;border:0;font-weight:700}
.go:hover:not(:disabled){background:#4af0de}
#game{max-width:760px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:.5rem .2rem;gap:.5rem}
.clock{font-variant-numeric:tabular-nums;font-size:1.3rem;padding:.2rem .7rem;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.clock.run{border-color:var(--teal);color:var(--teal)}
#board{--s:min(92vw,68vh,560px);width:var(--s);height:var(--s);margin:0 auto;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)/8*.78);line-height:1;cursor:pointer;user-select:none;position:relative}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.sel{box-shadow:inset 0 0 0 4px #19e6d0,inset 0 0 0 7px rgba(0,0,0,.75)}
.sq.last{background-image:linear-gradient(rgba(155,92,255,.5),rgba(155,92,255,.5))}
.sq.chk{box-shadow:inset 0 0 0 4px #ff2e4d,inset 0 0 0 7px rgba(0,0,0,.7)}
.pw{color:#f4f7ff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}
.pb{color:#0d0f14;text-shadow:0 0 2px #7a8399,0 0 1px #7a8399}
#status{text-align:center;min-height:1.6rem;margin:.7rem 0;color:var(--teal)}
#moves{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;max-height:6.5rem;overflow:auto;color:var(--dim);font-size:.9rem;line-height:1.6}
.ctl{margin-top:.8rem}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#19e6d0;border:3px solid rgba(0,0,0,.75);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.sq.dot.cap::after{width:88%;height:88%;background:none;border:4px solid #19e6d0;box-shadow:0 0 0 2px rgba(0,0,0,.8),inset 0 0 0 2px rgba(0,0,0,.8)}
#coach{background:var(--panel);border-left:4px solid var(--purple);border-radius:8px;padding:.7rem .9rem;margin:.6rem 0;line-height:1.45}
#coach:empty{display:none}
.tok{display:flex;align-items:center;justify-content:center;width:80%;height:80%;border-radius:50%;background:var(--tc);font-size:calc(var(--s)/8*.5);border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 4px rgba(0,0,0,.35);line-height:1}
.tok.tb{border-color:rgba(255,255,255,.35)}
.credit{text-align:center;color:var(--dim);font-size:.85rem;margin-top:1.8rem;line-height:1.5}
.mb{--s:min(80vw,320px);width:var(--s);height:var(--s);margin:.8rem auto;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin:1rem 0}
.setgrid button{text-align:left}
.setgrid small{display:block;color:var(--dim);font-size:.8rem;margin-top:.2rem}
#prevInfo{text-align:center;color:var(--dim);margin:.4rem 0 .8rem}
input[type=range]{accent-color:var(--teal);width:100%}
.co{position:absolute;font-size:calc(var(--s)/8*.2);line-height:1;pointer-events:none;font-family:sans-serif;font-weight:600}
.sq.l .co{color:var(--ink-l,#e8ecf4)}.sq.d .co{color:var(--ink-d,#e8ecf4)}
.co.rk{top:4%;left:5%}.co.fl{bottom:4%;right:6%}
.sq.sug{box-shadow:inset 0 0 0 4px #ffd166,inset 0 0 0 7px rgba(0,0,0,.8),0 0 0 1px #fff}
#log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin-top:.8rem;max-height:8rem;overflow:auto;font-size:.9rem;line-height:1.5;color:var(--dim)}
#log:empty{display:none}
#log .you{color:var(--purple)}
#chatRow{display:flex;gap:.5rem;margin-top:.6rem}
#chatIn{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.7rem;font:inherit}
#chatIn:focus-visible{outline:2px solid var(--purple)}
@media (prefers-reduced-motion:no-preference){.sq{transition:background .15s}}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <img class="logo" src="logo.svg" alt="Chessmaster AI crown logo">
  <h1 class="title">Chessmaster <span>AI</span></h1>
  <p class="sub">Learn it. Play it. Master it.</p>
  <div class="menu">
    <button onclick="openSetup('ai')">Play vs AI<small>Five levels, from Starter to Master</small></button>
    <button onclick="openSetup('two')">Two Player<small>Share one device</small></button>
    <button onclick="show('coachMenu');$('pts').textContent='Points: '+points">Coach Mode<small>Lessons, puzzles and a coach that helps as you play</small></button>
    <button onclick="openSets()">Chess Sets<small>Pick your pieces and preview sets you can earn</small></button>
    <button onclick="openVoice()">Voice options<small>Choose the coach's voice and speed</small></button>
  </div>
  <p class="credit">This game was designed by Leo C and built by Leo C with help from Claude AI.</p>
</section>

<section id="sets" class="screen">
  <h2>Chess Sets</h2>
  <p class="sub" id="setPts"></p>
  <div id="prevBoard" class="mb"></div>
  <div id="prevInfo"></div>
  <div class="row" style="justify-content:center"><button class="go" id="useBtn" onclick="useSet()">Use this set</button></div>
  <div id="setList" class="setgrid"></div>
  <div class="row"><button onclick="show('menu')">Back</button></div>
</section>

<section id="voiceSet" class="screen">
  <h2>Voice options</h2>
  <div class="opts">
    <label>Coach voice<select id="voiceSel" onchange="saveVoice();testVoice()"></select></label>
    <label>Speed: <span id="rateVal">1.0x</span><input type="range" id="voiceRate" min="0.7" max="1.4" step="0.1" value="1" oninput="saveVoice()" onchange="testVoice()"></label>
  </div>
  <p class="sub" style="text-align:left">Available voices depend on your device and browser.</p>
  <div class="row"><button class="go" onclick="testVoice()">Test voice</button><button onclick="show('menu')">Back</button></div>
</section>

<section id="coachMenu" class="screen">
  <h2>Coach Mode</h2>
  <p class="sub" id="pts"></p>
  <div class="menu">
    <button onclick="openSetup('ai',true)">Play with the coach<small>Shadow moves, hints and gentle feedback while you play the AI</small></button>
    <button onclick="startDrills('lesson')">Lessons<small>Openings and key ideas, step by step</small></button>
    <button onclick="startDrills('puzzle')">Puzzles<small>Mates, forks and tactics</small></button>
  </div>
  <div class="row" style="margin-top:1rem"><button onclick="show('menu')">Back</button></div>
</section>

<section id="setup" class="screen">
  <h2 id="setupTitle"></h2>
  <div class="opts">
    <label id="lvlWrap">Difficulty
      <select id="level">
        <option value="0">Starter</option><option value="1">Easy</option>
        <option value="2" selected>Medium</option><option value="3">Hard</option><option value="4">Master</option>
      </select></label>
    <label id="colWrap">Your colour
      <select id="color"><option value="w">White</option><option value="b">Black</option></select></label>
    <label id="cwWrap"><span></span>
      <select id="coachW"><option value="0">Coach off</option><option value="1">Basic: shows where pieces can move</option><option value="2">Learner: adds strategy tips</option><option value="3">Beginner: also suggests the best move</option></select></label>
    <label id="cbWrap"><span></span>
      <select id="coachB"><option value="0">Coach off</option><option value="1">Basic: shows where pieces can move</option><option value="2">Learner: adds strategy tips</option><option value="3">Beginner: also suggests the best move</option></select></label>
    <label>Timer
      <select id="timer">
        <option value="0">Untimed</option><option value="900">Casual: 15 min</option><option value="600">Casual: 10 min</option>
        <option value="300">Quick: 5 min</option><option value="180">Blitz: 3 min</option>
      </select></label>
  </div>
  <div class="row"><button class="go" onclick="startGame()">Start game</button><button onclick="show('menu')">Back</button></div>
</section>

<section id="game" class="screen">
  <div class="bar"><span id="topName"></span><span class="clock" id="clkTop"></span></div>
  <div id="board" role="grid" aria-label="Chess board"></div>
  <div class="bar"><span id="botName"></span><span class="clock" id="clkBot"></span></div>
  <div id="coach" aria-live="polite"></div>
  <div class="row" id="revRow"><button id="revBtn" class="go" onclick="reverseBad()" style="display:none">Reverse my move</button><button id="keepBtn" onclick="keepBad()" style="display:none">Keep it</button></div>
  <div id="status" aria-live="polite"></div>
  <div id="moves">No moves yet.</div>
  <div id="log" aria-live="polite"></div>
  <div id="chatRow">
    <input id="chatIn" placeholder="Ask the coach: how does a knight move?" onkeydown="if(event.key==='Enter')ask()">
    <button onclick="ask()">Ask</button>
    <button id="micBtn" onclick="listen()">Speak</button>
  </div>
  <div class="row ctl" id="ctRow">
    <button id="ctW" onclick="toggleCoach('w')"></button>
    <button id="ctB" onclick="toggleCoach('b')"></button>
  </div>
  <div class="row ctl">
    <button id="hintBtn" onclick="hint()">Hint</button>
    <button id="nextBtn" class="go" onclick="nextDrill()" style="display:none">Next</button>
    <button id="undoBtn" onclick="undo()">Undo</button>
    <button onclick="toggleSound()" id="sndBtn">Sound: on</button>
    <button onclick="toggleVoice()" id="voiceBtn">Voice: on</button>
    <button onclick="speak(lastSpoken,true)">Repeat</button>
    <button id="newBtn" onclick="startGame()">New game</button>
    <button onclick="quit()">Menu</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const GLYPH={p:'\u265F\uFE0E',n:'\u265E',b:'\u265D',r:'\u265C',q:'\u265B',k:'\u265A'};
const LEVELS=[{n:'Starter',skill:0,ms:60,depth:1,rand:.5},{n:'Easy',skill:4,ms:100,depth:1,rand:.15},
  {n:'Medium',skill:9,ms:250,depth:2,rand:0},{n:'Hard',skill:15,ms:600,depth:2,rand:0},{n:'Master',skill:20,ms:1200,depth:3,rand:0}];
let coach={w:0,b:0},sug=null,fb='',badPending=null,okMove=null,drill=null,dl=[],di=0,mode='ai',game,sel=null,human='w',lvl=LEVELS[2],clocks={w:0,b:0},tick=null,over=false,sound=true,thinking=false,last=null;

let points=0;try{points=+localStorage.getItem('cm_points')||0}catch(e){}
let curSet='classic',prevId='classic',done=[],vName='',vRate=1;
try{curSet=localStorage.getItem('cm_set')||'classic';done=JSON.parse(localStorage.getItem('cm_done')||'[]');vName=localStorage.getItem('cm_vname')||'';vRate=+localStorage.getItem('cm_vrate')||1}catch(e){}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function openSetup(m,coachOn){mode=m;$('setupTitle').textContent=m==='ai'?(coachOn?'Play with the coach':'Play vs AI'):'Two Player';
  $('lvlWrap').style.display=$('colWrap').style.display=m==='ai'?'grid':'none';
  $('cbWrap').style.display=m==='ai'?'none':'grid';
  $('cwWrap').querySelector('span').textContent=m==='ai'?'Coach for you':'Coach for White';
  $('cbWrap').querySelector('span').textContent='Coach for Black';
  $('coachW').value=coachOn?'2':'0';$('coachB').value='0';show('setup')}
function quit(){clearInterval(tick);show('menu')}

/* ---------- Stockfish (loaded from CDN, with a built-in fallback) ---------- */
let sf=null,sfReady=false,sfCb=null;
function initStockfish(){
  try{
    const url='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
    sf=new Worker(URL.createObjectURL(new Blob(['importScripts("'+url+'")'],{type:'text/javascript'})));
    sf.onmessage=e=>{const l=String(e.data);
      if(l==='uciok'){sfReady=true;sf.postMessage('isready')}
      else if(l.startsWith('bestmove')&&sfCb){const m=l.split(' ')[1];const cb=sfCb;sfCb=null;cb(m)}};
    sf.onerror=()=>{sfReady=false};
    sf.postMessage('uci');
  }catch(e){sfReady=false}
}
function engineMove(cb,skill=lvl.skill,ms=lvl.ms,l=lvl){
  if(sfReady){
    sfCb=m=>{if(m&&m!=='(none)')cb({from:m.slice(0,2),to:m.slice(2,4),promotion:m[4]});else cb(fallbackMove(l))};
    sf.postMessage('setoption name Skill Level value '+skill);
    sf.postMessage('position fen '+game.fen());
    sf.postMessage('go movetime '+ms);
  }else setTimeout(()=>cb(fallbackMove(l)),350);
}
const VAL={p:100,n:320,b:330,r:500,q:900,k:0};
function evalBoard(){let s=0;for(const row of game.board())for(const p of row)if(p)s+=(p.color==='w'?1:-1)*VAL[p.type];return s}
function search(d,a,b,maxi){
  if(d===0||game.game_over())return evalBoard();
  let best=maxi?-1e9:1e9;
  for(const m of game.moves()){game.move(m);const v=search(d-1,a,b,!maxi);game.undo();
    if(maxi){best=Math.max(best,v);a=Math.max(a,v)}else{best=Math.min(best,v);b=Math.min(b,v)}
    if(b<=a)break}
  return best;
}
function fallbackMove(l=lvl){
  const ms=game.moves({verbose:true});
  if(Math.random()<l.rand)return ms[Math.floor(Math.random()*ms.length)];
  const white=game.turn()==='w';let best=null,bv=white?-1e9:1e9;
  for(const m of ms.sort(()=>Math.random()-.5)){game.move(m);const v=search(l.depth-1,-1e9,1e9,!white);game.undo();
    if(white?v>bv:v<bv){bv=v;best=m}}
  return best;
}

/* ---------- Game flow ---------- */
function startGame(){
  game=new Chess();sel=null;over=false;thinking=false;last=null;sfCb=null;
  lvl=LEVELS[+$('level').value];human=mode==='ai'?$('color').value:'w';
  if(mode==='ai'){const on=+$('coachW').value;coach={w:human==='w'?on:0,b:human==='b'?on:0}}
  else coach={w:+$('coachW').value,b:+$('coachB').value};sug=null;fb='';badPending=null;
  drill=null;
  const t=+$('timer').value;clocks={w:t,b:t};
  $('topName').textContent=mode==='ai'?lvl.n+' AI':'Player 2 (Black)';
  $('botName').textContent=mode==='ai'?'You':'Player 1 (White)';
  show('game');clearInterval(tick);
  const hc=coach.w||coach.b;coachUI();$('ctRow').style.display='';$('log').innerHTML='';
  $('undoBtn').style.display=$('newBtn').style.display='';$('nextBtn').style.display='none';
  say(hc?"Coach is on! Pick a piece and teal dots show where it can go. Press Hint any time you'd like a suggestion.":'');
  tick=setInterval(onTick,1000);render();
  if(mode==='ai'&&human==='b')aiTurn();else coachTurn();
}
function onTick(){
  const t=+$('timer').value;if(!t||over||mode==='drill'||badPending)return;
  clocks[game.turn()]--;
  if(clocks[game.turn()]<=0){clocks[game.turn()]=0;over=true;
    const w=game.turn()==='w'?'b':'w';let t=(w==='w'?'White':'Black')+' wins on time.';
    if(mode==='ai'&&w===human){const n=[5,10,20,35,50][LEVELS.indexOf(lvl)];t+=' +'+n+' points!'+addPoints(n)}
    $('status').textContent=t;beep(200,.4)}
  renderClocks();
}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderClocks(){
  if(mode==='drill'){['clkTop','clkBot'].forEach(i=>$(i).style.display='none');$('topName').textContent='';$('botName').textContent=drill.type==='lesson'?'Lesson':'Puzzle';return}
  const t=+$('timer').value,flip=human==='b'&&mode==='ai';
  const top=flip?'w':'b',bot=flip?'b':'w';
  for(const [id,c] of [['clkTop',top],['clkBot',bot]]){const e=$(id);
    e.style.display=t?'':'none';e.textContent=fmt(clocks[c]);e.classList.toggle('run',!over&&game.turn()===c)}
  $('topName').textContent=mode==='ai'?(flip?'You':lvl.n+' AI'):(flip?'Player 1 (White)':'Player 2 (Black)');
  $('botName').textContent=mode==='ai'?(flip?lvl.n+' AI':'You'):'Player 1 (White)';
}
function co(t,c){const e=document.createElement('span');e.className='co '+c;e.textContent=t;return e}
function render(){
  const b=$('board');b.innerHTML='';const ST=setById(curSet);b.style.setProperty('--light',ST.light);b.style.setProperty('--dark',ST.dark);b.style.setProperty('--ink-l',ink(ST.light));b.style.setProperty('--ink-d',ink(ST.dark));
  const flip=mode==='ai'&&human==='b';
  const inCheck=game.in_check(),turn=game.turn();
  const targets={};if(sel&&helpOn())game.moves({square:sel,verbose:true}).forEach(m=>targets[m.to]=m);
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const rr=flip?7-r:r,ff=flip?7-f:f,name='abcdefgh'[ff]+(8-rr);
    const p=game.get(name),d=document.createElement('div');
    d.className='sq '+((rr+ff)%2?'d':'l');
    if(name===sel)d.classList.add('sel');
    if(targets[name]){d.classList.add('dot');if(targets[name].captured)d.classList.add('cap')}
    if(sug&&(name===sug.from||name===sug.to))d.classList.add('sug');
    if(last&&(name===last.from||name===last.to))d.classList.add('last');
    if(inCheck&&p&&p.type==='k'&&p.color===turn)d.classList.add('chk');
    if(p)pieceEl(d,p,ST);
    if(f===0)d.appendChild(co(8-rr,'rk'));
    if(r===7)d.appendChild(co('abcdefgh'[ff],'fl'));
    d.setAttribute('role','gridcell');d.setAttribute('aria-label',name+(p?' '+p.color+p.type:''));
    d.onclick=()=>clickSq(name);b.appendChild(d);
  }
  const h=game.history();let html='';
  for(let i=0;i<h.length;i+=2)html+=(i/2+1)+'. '+h[i]+' '+(h[i+1]||'')+'&nbsp;&nbsp; ';
  $('moves').innerHTML=html||'No moves yet.';$('moves').scrollTop=1e6;
  if(!over&&mode==='drill')$('status').textContent=(turn==='w'?'White':'Black')+' to move';
  else if(!over)$('status').textContent=thinking?'AI is thinking...':(turn==='w'?'White':'Black')+' to move'+(inCheck?' - check!':'');
  renderClocks();
  $('revBtn').style.display=$('keepBtn').style.display=badPending?'':'none';
}
function clickSq(name){
  if(over||thinking||(mode==='ai'&&game.turn()!==human)||(mode==='drill'&&drill.done)||badPending)return;
  const p=game.get(name);
  if(sel){
    if(game.moves({square:sel,verbose:true}).some(x=>x.to===name)){
      const track=mode!=='drill'&&coach[game.turn()];
      const trusted=!!(track&&okMove&&okMove.fen===game.fen()&&okMove.from===sel&&okMove.to===name);
      const pre=track&&!trusted?search(2,-1e9,1e9,game.turn()==='w'):0;
      const m=game.move({from:sel,to:name,promotion:'q'});sel=null;
      if(mode==='drill'){drillCheck(m);return}
      if(trusted)fb="Great choice! That was the coach's suggestion.";
      const bad=track&&!trusted&&!game.game_over()?review(m,pre):false;
      if(bad)badPending={lv:coach[m.color]};
      afterMove(m,bad);coachTurn();return;
    }
  }
  sel=p&&p.color===game.turn()?name:null;render();
}
function afterMove(m,hold){
  last={from:m.from,to:m.to};sug=null;okMove=null;
  if(game.in_checkmate()){over=true;beep(520,.5);let t='Checkmate! '+(m.color==='w'?'White':'Black')+' wins.';
    if(mode==='ai'&&m.color===human){const n=[5,10,20,35,50][LEVELS.indexOf(lvl)];t+=' +'+n+' points!'+addPoints(n)}
    $('status').textContent=t}
  else if(game.in_draw()){over=true;beep(300,.4);$('status').textContent='Draw.'}
  else beep(m.captured?330:440,.08,m.captured?'square':'sine');
  if(game.in_check()&&!over)beep(600,.15,'sawtooth');
  render();
  if(!over&&!hold&&mode==='ai'&&game.turn()!==human)aiTurn();
}
function aiTurn(){
  thinking=true;render();

function helpOn(){return mode==='drill'?drill.type==='lesson':!!coach[game.turn()]}
function why(m){
  if(m.flags.includes('k')||m.flags.includes('q'))return 'Castling tucks your king to safety and brings a rook into play.';
  if(m.promotion)return 'Promoting gives you a brand new queen!';
  game.move({from:m.from,to:m.to,promotion:m.promotion});const mate=game.in_checkmate(),chk=game.in_check();game.undo();
  if(mate)return 'That is checkmate. The game ends here!';
  if(m.captured)return 'It wins a '+PN[m.captured]+(chk?' and gives check.':'.');
  if(chk)return 'It gives check and keeps the pressure on.';
  const n=game.history().length;
  if(m.piece==='p'&&'de'.includes(m.to[0])&&n<8)return 'Controlling the centre gives your pieces room to move.';
  if((m.piece==='n'||m.piece==='b')&&n<14)return 'Developing a piece early gets it into the game.';
  return 'It improves your position and keeps your pieces safe.';
}
const LN=['off','Basic','Learner','Beginner'];
function review(m,pre){
  const lv=coach[m.color],sgn=m.color==='w'?1:-1,post=search(1,-1e9,1e9,game.turn()==='w'),drop=(pre-post)*sgn;
  if(drop>=(lv>=2?100:300)){
    let best=null,bv=1e9;
    for(const r of game.moves({verbose:true})){game.move({from:r.from,to:r.to,promotion:r.promotion});const v=sgn*evalBoard();game.undo();if(v<bv){bv=v;best=r}}
    const pts=Math.max(1,Math.round(drop/100)),pl=pts>1?'s':'';
    if(best&&best.captured)fb=lv>=2
      ?'Careful! Their '+PN[best.piece]+' can capture your '+PN[best.captured]+' on '+best.to+', which would cost you about '+pts+' point'+pl+' of material. Before each move, check which of your pieces the opponent can attack. Want to reverse it?'
      :'Careful! Your '+PN[best.captured]+' on '+best.to+' can be captured. Want to reverse it?';
    else fb=lv>=2
      ?'That move gives away about '+pts+' point'+pl+' of material. Reversing it lets you look for a safer idea. Want to reverse it?'
      :'That move looks like a mistake. Want to reverse it?';
    return true;
  }
  if(m.captured||m.san.includes('+'))fb=m.captured?'Nice capture! You won a '+PN[m.captured]+'.':'Nice check! Keep the pressure on.';
  else fb=['Good, solid move.','Nice! Keep it up.','That works well. Keep your pieces protected.'][game.history().length%3];
  return false;
}
function reverseBad(){
  if(!badPending)return;
  const lv=badPending.lv;badPending=null;game.undo();last=null;sel=null;sug=null;beep(300,.15);
  fb='Move reversed. '+(lv>=2?'Have another look, and I will help.':'Try a different move.');
  render();coachTurn();
}
function keepBad(){
  if(!badPending)return;
  badPending=null;fb='';render();
  if(mode==='ai'&&game.turn()!==human)aiTurn();else say('Okay, keeping it. Good luck!');
}
function strategyTip(){
  const t=game.turn(),n=game.history().length;
  if(game.in_check())return 'Tip: you are in check! Move your king, block the attack, or capture the piece giving check.';
  try{
    const o=new Chess(game.fen().replace(/ [wb] /,t==='w'?' b ':' w ').replace(/ [a-h][36] /,' - '));
    const hit=o.moves({verbose:true}).filter(x=>x.captured&&VAL[x.captured]>=300).sort((x,y)=>VAL[y.captured]-VAL[x.captured])[0];
    if(hit)return 'Tip: your '+PN[hit.captured]+' on '+hit.to+' could be captured. Move it, or make sure it is protected.';
  }catch(e){}
  const my=game.moves({verbose:true}).filter(x=>x.captured&&VAL[x.captured]>=VAL[x.piece]);
  if(my.length)return 'Tip: you can capture a '+PN[my[0].captured]+' on '+my[0].to+'. Check that your capturing piece will be safe first.';
  if(n<4)return 'Tip: fight for the centre. Pawns on d4 or e4 (d5 or e5 for Black) give your pieces room to move.';
  if(n<6)return 'Tip: bring out your knights and bishops before moving the same piece twice.';
  if(n<24&&(t==='w'?/[KQ]/:/[kq]/).test(game.fen().split(' ')[2]))return 'Tip: castle soon. It protects your king and brings a rook into the game.';
  let c=0;for(const row of game.board())for(const p of row)if(p&&p.type!=='k'&&p.type!=='p')c++;
  if(c<=4)return 'Tip: in the endgame, bring your king towards the action and push your pawns to promote.';
  return 'Tip: keep your pieces protected, look for forks and pins, and put your rooks on open files.';
}
function suggest(pre){
  const f=game.fen();
  engineMove(m=>{
    if(game.fen()!==f)return;
    const mv=game.moves({verbose:true}).find(x=>x.from===m.from&&x.to===m.to);if(!mv)return;
    sug={from:mv.from,to:mv.to};okMove={from:mv.from,to:mv.to,fen:f};say((pre?pre+' ':'')+'Suggested move: '+mv.san+' (gold squares). '+why(mv));render();
  },20,700,LEVELS[4]);
}
function coachTurn(){
  if(over||mode==='drill')return;
  const t=game.turn(),lv=coach[t];let msg=fb;fb='';
  if(badPending){say(msg);return}
  if(!lv||(mode==='ai'&&t!==human)){if(msg)say(msg);return}
  if(lv===2)msg+=(msg?' ':'')+strategyTip();
  if(lv===3){say((msg?msg+' ':'')+'Finding the best move for you...',true);suggest(msg);return}
  if(msg)say(msg);
}
function hint(){
  if(over||thinking)return;
  if(badPending){say('Choose Reverse my move or Keep it first.',true);return}
  if(mode==='drill'){if(drill.done)return;sel=drill.ok[0].slice(0,2);say('Hint: '+drill.tip);render();return}
  if(!coach[game.turn()]){say('Switch the coach on for this side to use hints.');return}
  if(mode==='ai'&&game.turn()!==human)return;
  say('Let me think...',true);
  engineMove(m=>{const mv=game.moves({verbose:true}).find(x=>x.from===m.from&&x.to===m.to);
    if(!mv)return;sel=mv.from;okMove={from:mv.from,to:mv.to,fen:game.fen()};say('Try '+mv.san+'. '+why(mv));render()},20,800,LEVELS[4]);
}

function drillCheck(m){
  const uci=m.from+m.to+(m.promotion&&drill.ok.some(o=>o.length>4)?m.promotion:'');
  if(drill.ok.includes(uci)){
    drill.done=true;beep(660,.25);last={from:m.from,to:m.to};
    const first=!done.includes(drill.n);let extra=' You already earned points for this one.';
    if(first){done.push(drill.n);try{localStorage.setItem('cm_done',JSON.stringify(done))}catch(e){}extra=' +10 points (total '+(points+10)+').'+addPoints(10)}

  $('chatIn').value='';logLine('You',v);const q=v.toLowerCase();
  if(/hint|best move|suggest|what should i|which move|help me/.test(q)){hint();return}

let ac=null;
function beep(freq,dur,type='sine'){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}
}

initStockfish();$('voiceBtn').textContent='Voice: '+(voiceOn?'on':'off');
